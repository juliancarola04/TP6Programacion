    <!-- Esto es lo que voy a usar para descargar el pdf de la venta desp en blazor.
        Tuve que modificar un poco como lo hacia el profe poprque me jodia TS-->
    <script>
            function descargarPdf(nombre = "", contenido = new Uint8Array()) {
                const archivo = new Blob([contenido], { type: "application/pdf" });
                const url = URL.createObjectURL(archivo);
                const enlace = document.createElement("a");

                enlace.href = url;
                enlace.download = nombre;
                document.body.appendChild(enlace);
                enlace.click();
                enlace.remove();

                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
    </script>
</body>
